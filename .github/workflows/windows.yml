name: Windows build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MSBuildEnableWorkloadResolver: 'false'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: |
          dotnet build src/Folio.slnx -c Release -m:1 -p:UseSharedCompilation=false --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Run Core checks with synthetic data
        run: |
          $syntheticRoot = Join-Path $env:RUNNER_TEMP 'ClearNote-checks'
          dotnet run --project src/Folio.Tests/Folio.Tests.csproj -c Release --no-build -- $syntheticRoot
          if ($LASTEXITCODE -ne 0) { throw 'Core checks failed.' }

      - name: Run Windows UI component checks with synthetic data
        run: |
          $syntheticRoot = Join-Path $env:RUNNER_TEMP 'ClearNote-checks'
          dotnet run --project src/Folio.Tests/Folio.UiTests/Folio.UiTests.csproj -c Release --no-build -- $syntheticRoot
          if ($LASTEXITCODE -ne 0) { throw 'UI checks failed.' }

      - name: Publish portable executable
        run: |
          dotnet publish src/Folio.App/Folio.App.csproj -c Release -p:PublishProfile=Portable -m:1 -p:UseSharedCompilation=false --nologo -o ./app
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          if (-not (Test-Path -LiteralPath ./app/ClearNote.exe -PathType Leaf)) { throw 'Portable executable is missing.' }
          Copy-Item -LiteralPath ./README.md, ./LICENSE -Destination ./app

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: ClearNote-windows-x64-${{ github.sha }}
          path: |
            app/ClearNote.exe
            app/README.md
            app/LICENSE
          if-no-files-found: error
          retention-days: 14
